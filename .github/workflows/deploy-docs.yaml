name: Deploy the documentation

# Pushes to main publish docs.rendercv.com (see wrangler.toml). A pull request gets a
# preview that follows its latest commit and is deleted when it closes. Pull requests
# from forks and Dependabot don't get the Cloudflare token, so they're only built.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# The latest commit wins, and closing a pull request stops its deployment:
concurrency:
  group: docs-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build docs
        run: just build-docs

      - name: Deploy to docs.rendercv.com
        if: github.event_name == 'push'
        run: bunx wrangler@4.156.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy the preview
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No Cloudflare token for this pull request, so it gets no preview."
            exit 0
          fi
          url=$(bunx wrangler@4.156.0 preview --name "pr-$NUMBER" --json | jq -er '.preview.urls[0]')
          gh pr comment "$NUMBER" --edit-last --create-if-none \
            --body "Documentation preview of $HEAD_SHA: $url"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.number }}

  delete-preview:
    name: Delete the preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Delete the preview
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            exit 0
          fi
          bunx wrangler@4.156.0 preview delete --name "pr-$NUMBER" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NUMBER: ${{ github.event.number }}
