name: Publish rendercv-fonts

# Pushing a tag like rendercv-fonts-v0.6.0 publishes that version of
# packages/rendercv-fonts to PyPI. The fonts change rarely, so they're released on
# their own instead of with every RenderCV release. The tag is the whole release:
# without a GitHub release, RenderCV's release stays the latest one.
on:
  push:
    tags:
      - rendercv-fonts-v*

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yaml

  publish:
    name: Publish to PyPI
    needs:
      - test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Check that the tag matches the version
        run: test "$GITHUB_REF_NAME" = "rendercv-fonts-v$(uv version --package rendercv-fonts --short)"

      - name: Build
        run: uv build --package rendercv-fonts

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
