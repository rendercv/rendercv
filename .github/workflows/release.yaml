name: Publish a release

# GitHub events that trigger the workflow:
on:
  release:
    types:
      - published
jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yaml

  # update_files:
  #   name: Update schema.json, examples, and entry figures
  #   uses: ./.github/workflows/update-files.yaml
  #   needs:
  #     - test

  build:
    name: Build the Package
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Check that the tag matches the version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --package rendercv --short)"

      # Users get the fonts from PyPI, so the fonts that RenderCV was tested with must
      # be a released version (see release-fonts.yaml), unchanged since its release:
      - name: Check that the fonts are released
        run: |
          tag="rendercv-fonts-v$(uv version --package rendercv-fonts --short)"
          git fetch --depth=1 --filter=blob:none origin tag "$tag" || {
            echo "::error::$tag doesn't exist. Release the fonts first."
            exit 1
          }
          if [ "$(git rev-parse "$tag:packages/rendercv-fonts")" != "$(git rev-parse HEAD:packages/rendercv-fonts)" ]; then
            echo "::error::packages/rendercv-fonts changed after $tag. Release a new version of the fonts first."
            exit 1
          fi

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Download the Typst packages that RenderCV ships
        run: just download-typst-packages

      - name: Build
        run: uv build --package rendercv

      - name: Upload the wheel and source distribution as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  create_executables:
    name: Create Executables
    needs:
      - test
    uses: ./.github/workflows/create-executables.yaml

  create_github_release:
    name: Add assets to the GitHub Release
    needs:
      - build
      - create_executables
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the executables
        uses: actions/download-artifact@v8
        with:
          pattern: rendercv-*
          merge-multiple: false

      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Add assets to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            rendercv-*/rendercv-linux-ARM64.zip
            rendercv-*/rendercv-linux-x86_64.zip
            rendercv-*/rendercv-macos-ARM64.zip
            rendercv-*/rendercv-windows-x86_64.zip
            dist/rendercv-*.whl

  publish_to_pypi:
    name: Publish to PyPI
    needs:
      - create_github_release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish_skill:
    name: Publish the AI agent skill
    needs:
      - publish_to_pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Check out rendercv/rendercv-skill
        uses: actions/checkout@v7
        with:
          repository: rendercv/rendercv-skill
          # A deploy key with write access to rendercv/rendercv-skill:
          ssh-key: ${{ secrets.RENDERCV_SKILL_DEPLOY_KEY }}
          path: rendercv-skill

      - name: Replace the skill
        run: |
          git -C rendercv-skill rm -rq .
          uv run --frozen --all-extras scripts/rendercv_skill/generate.py rendercv-skill

      - name: Push the skill
        working-directory: rendercv-skill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # A rerun of the same release has nothing new to publish:
          if ! git diff --cached --quiet; then
            git commit -m "RenderCV $GITHUB_REF_NAME"
            git push
          fi

      - name: Add the skill to the GitHub release
        run: |
          cd rendercv-skill/skills
          zip -qr "$RUNNER_TEMP/rendercv_skill.zip" rendercv
          gh release upload --clobber "$GITHUB_REF_NAME" "$RUNNER_TEMP/rendercv_skill.zip"
        env:
          GH_TOKEN: ${{ github.token }}

  publish_docker_to_ghcr:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs:
      - publish_to_pypi
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
