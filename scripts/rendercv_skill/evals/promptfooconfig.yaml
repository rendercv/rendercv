# Generate the skill, then evaluate it:
#   uv run scripts/rendercv_skill/generate.py /tmp/rendercv-skill
#   RENDERCV_SKILL_DIRECTORY=/tmp/rendercv-skill bunx promptfoo eval -c scripts/rendercv_skill/evals/promptfooconfig.yaml
description: RenderCV Skill Evaluation

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      temperature: 0.0
      max_tokens: 4096

prompts:
  - file://prompts/skill_chat.js

tests:
  - file://tests/cv_generation.yaml
  - file://tests/design.yaml
  - file://tests/cli_workflow.yaml
  - file://tests/pdf_parsing.yaml
